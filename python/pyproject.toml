[project]
name = "markov-decision-process"
version = "0.1.0"
description = "Examples of Markov Decision Processes: cake eating, lifecycle consumption and savings, and windy gridworld"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=2.2",
    "scikit-learn>=1.7",
    "scipy>=1.14",
]

[tool.uv]
# These are standalone scripts, not an installable package
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
